# Builds the zip with the three addons when a version tag is pushed (wowaddons
# publish does that) and publishes it as a GitHub release for WowUp.
name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip and release.json
        run: |
          zip -r "guild-addons-$GITHUB_REF_NAME.zip" Skatteverket Swedbank Bokforing
          interface=$(grep -m1 '^## Interface:' Skatteverket/Skatteverket.toc | tr -dc '0-9')
          cat > release.json <<EOF
          {"releases":[{"name":"guild-addons","version":"$GITHUB_REF_NAME","filename":"guild-addons-$GITHUB_REF_NAME.zip","nolib":false,"metadata":[{"flavor":"classic","interface":$interface}]}]}
          EOF
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "guild-addons-$GITHUB_REF_NAME.zip" release.json \
            --title "$GITHUB_REF_NAME" --notes "Skatteverket och Swedbank för THÖNDERSTÖRM."
